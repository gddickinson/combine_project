[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "combine-project"
version = "0.1.0"
description = "Combine Python project files into a single text file for sharing with LLMs"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
combine-project = "combine_project:main"
